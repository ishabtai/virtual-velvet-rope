name: תחזית יומית

# Runs the forecast every morning and commits the dated snapshot. The site
# serves those files directly, so a run that fails leaves yesterday's forecast
# in place rather than showing a broken page.
on:
  schedule:
    # 04:10 UTC — after the previous evening's Israeli news bulletins have
    # published their polls, and before the morning audience arrives.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "How many past days to rebuild as well"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The model runs before the forecast does. A green test suite is the only
      # thing standing between a bad refactor and a published number.
      - run: npm test

      - run: npm run forecast -- --backfill ${{ github.event.inputs.backfill || '0' }}

      - name: Commit the snapshot
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No change in the forecast today."
            exit 0
          fi
          git commit -m "תחזית יומית: $(date -u +%Y-%m-%d)"
          git push
