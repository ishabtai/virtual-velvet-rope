name: סריקה יומית, תחזית ופרסום

# The whole pipeline, once a day: scrape the polls, rebuild the forecast, commit
# the snapshot, and publish the site to GitHub Pages.
#
# The steps are ordered so a failure degrades instead of breaking. The scrape
# may fail entirely and the forecast still runs on the curated set; the commit
# may find nothing to commit and the deploy still happens. Only a failing test
# suite stops the run, because that is the one failure that would publish a
# wrong number.
on:
  schedule:
    # 04:10 UTC — after the previous evening's Israeli bulletins have published
    # their polls, and before the morning audience arrives.
    - cron: "10 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: "How many past days to rebuild as well"
        required: false
        default: "0"
      skip_scrape:
        description: "Skip the scrape and rebuild from stored polls only"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The model runs before the forecast does. A green suite is the only thing
      # standing between a bad refactor and a published number.
      - name: Tests
        run: npm test

      # Fail-soft: a newspaper changing its markup must not stop the forecast.
      # scripts/scrape.ts exits non-zero only when EVERY source failed, and even
      # that is tolerated here so the run continues on the curated set.
      - name: Scrape polls
        if: ${{ inputs.skip_scrape != true }}
        continue-on-error: true
        run: npm run scrape

      - name: Build forecast
        run: npm run forecast -- --backfill ${{ inputs.backfill || '0' }}

      - name: Commit polls and snapshots
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data public/data
          if git diff --staged --quiet; then
            echo "Nothing changed today."
            exit 0
          fi
          git commit -m "תחזית יומית: $(date -u +%Y-%m-%d)"

          # Everything this step commits is GENERATED. Rebasing generated output
          # onto other generated output conflicts on essentially every line and
          # the conflict is meaningless — there is no hand-written change to
          # preserve, only a question of which run produced its files last.
          #
          # The earlier version rebased and swallowed the failure with "|| true",
          # which left the runner on a detached HEAD mid-rebase and then failed
          # the push with exit 128. Two runs hit exactly that.
          #
          # So: merge rather than rebase, and resolve conflicting hunks in favour
          # of this run (-X ours), because this run generated its files from the
          # same or newer inputs. Files the other run added and we did not touch
          # still merge in normally.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — another run landed first. Merging and retrying."
            git fetch origin ${{ github.ref_name }}
            git merge origin/${{ github.ref_name }} -X ours --no-edit || {
              git merge --abort || true
              echo "::error::Could not reconcile generated data with origin."
              exit 1
            }
          done
          echo "::error::Push still rejected after 3 attempts."
          exit 1

      - name: Build site
        run: npm run build

      # NOTE: Pages must be switched on ONCE by a human, in
      # Settings -> Pages -> Source: "GitHub Actions".
      #
      # `enablement: true` was tried here and does not work: the automatic
      # GITHUB_TOKEN can DEPLOY to an existing Pages site but cannot CREATE one.
      # Creating it needs repository admin rights the token does not carry, and
      # the step fails with "Create Pages site failed. Error: Resource not
      # accessible by integration". Leaving the flag on would just fail every
      # run until someone enabled Pages by hand anyway.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
